name: admob_mediation_flutter
description: >-
  An unofficial Flutter service layer for AdMob mediation with UMP consent,
  preloading, retry backoff, frequency caps, ad widgets, and revenue events.
version: 0.1.1

homepage: https://github.com/zubairali001/admob_mediation_flutter
repository: https://github.com/zubairali001/admob_mediation_flutter
issue_tracker: https://github.com/zubairali001/admob_mediation_flutter/issues
topics:
  - ads
  - admob
  - mediation
  - monetization
  - google-mobile-ads

platforms:
  android:
  ios:

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
