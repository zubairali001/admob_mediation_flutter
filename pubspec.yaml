name: admob_mediation_flutter
description: >-
  Production-ready AdMob mediation for Flutter. One-call initialization with
  UMP consent, pre-loading, retry backoff, frequency caps, and an analytics
  event bus. Supports all ad formats and any combination of mediation networks.
version: 1.0.0

repository: https://github.com/zubairali001/admob_mediation_flutter
topics:
  - ads
  - admob
  - mediation
  - monetization
  - google-mobile-ads

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^8.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
